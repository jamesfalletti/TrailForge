<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="logo">↗</div><div>TRAILFORGE<small>RIDE YOUR GROUND</small></div></div><div class="top-right"><div class="status"><span id="gpsDot" class="dot"></span><span id="gpsStatus">Location off</span></div><button class="topbtn" id="locateTop">◎ <span class="wide">Find me</span></button></div></header>
  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-head"><div class="eyebrow">YOUR PRIVATE TRACKBOOK</div><h1>Make your ground<br>your raceway.</h1><p class="sub">Map a line. Ride it. Chase your best.</p></div>
      <nav class="tabs"><button class="tab active" data-tab="trails">Trails</button><button class="tab" data-tab="builder">Build</button><button class="tab" data-tab="results">Results</button><button class="tab" data-tab="settings">Settings</button></nav>
      <section class="content" id="content"></section>
    </aside>
    <section class="map-area"><div id="map"></div><div class="focus-top" id="focusTop"><button class="map-chip" id="exitFocus">‹ Exit ride</button><strong id="focusTrailName"></strong><span id="focusGpsStatus">Location off</span></div>
      <div class="map-toolbar"><button class="map-chip active" id="satelliteBtn">Satellite</button><button class="map-chip" id="streetBtn">Street</button></div>
      <div class="map-actions"><button class="map-chip locate" id="locateMap" aria-label="Find my location">◎</button></div>
      <div class="speed-overlay" id="speedOverlay" aria-live="polite"><strong id="speedValue">0</strong><span>MPH</span></div>
      <div class="map-bottom"><div class="toast" id="mapHint">Find your property, then choose <b>Build</b> to draw a route.</div><div class="ride-panel"><div class="ride-trail" id="rideLabel">SELECT A TRAIL</div><div class="clock" id="timer">00:00.00</div><div class="ride-buttons"><button class="action primary" id="armAuto" disabled>Auto time</button><button class="action secondary" id="startRide" disabled>Manual start</button><button class="action danger" id="finishRide" hidden>Finish</button><button class="action secondary" id="newRide" hidden>New run</button><button class="action secondary" id="viewResults" hidden>Results</button><button class="action danger" id="deleteRide" hidden>Delete run</button></div></div></div>
    </section>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const key='trailforge-v1';
  const settingsKey='trailforge-settings';
  let trails=[]; try{trails=JSON.parse(localStorage.getItem(key)||'[]')}catch{}
  let rides=[]; try{rides=JSON.parse(localStorage.getItem(key+'-rides')||'[]')}catch{}
  let settings={startMode:'marker',finishMode:'marker',showSpeed:false};try{settings={...settings,...JSON.parse(localStorage.getItem(settingsKey)||'{}')}}catch{}
  let selectedId=null, activeTab='trails', drawing=false, draft=[], draftLine=null, draftFinishesAtStart=false, savedLayers=[], gpsMarker=null, accuracyCircle=null, watchId=null, rideStart=null, timerLoop=null, rideTrack=[], rideLine=null, lastPos=null, recordingTrail=false, recordWatch=null, recordedPoints=[], recordLine=null, autoArmed=false, autoDeparted=false, autoLeftFinish=false, autoWatch=null, autoPrevDist=null, autoFirstFix=true, autoWasAtStart=false, autoOrigin=null, autoPrevMoved=0, autoMovingSamples=0, autoFinishSamples=0, launchArmed=false,launchSpeedSamples=0,launchOrigin=null,lastSpeedFix=null,smoothedSpeedMph=0,focusMode=false,resultsTrailId=null,activeRideId=null,rideResultLayer=null,rideJustFinished=false,lastSavedRideId=null;
  const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([39.5,-98.35],4);
  L.control.attribution({position:'bottomleft'}).addTo(map);
  L.control.zoom({position:'bottomright'}).addTo(map);
  const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'});
  const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
  satellite.addTo(map);
  const fmtTime=ms=>{let cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`};
  const persist=()=>localStorage.setItem(key,JSON.stringify(trails));
  const persistRides=()=>localStorage.setItem(key+'-rides',JSON.stringify(rides));
  const selected=()=>trails.find(t=>t.id===selectedId);
  function status(text,on=false){$('#gpsStatus').textContent=text;$('#focusGpsStatus').textContent=text;$('#gpsDot').classList.toggle('on',on)}
  function saveSettings(){localStorage.setItem(settingsKey,JSON.stringify(settings));$('.app').classList.toggle('speed-visible',!!settings.showSpeed)}
  function updateSpeed(pos){const c=pos.coords;let mps=Number.isFinite(c.speed)&&c.speed>=0?c.speed:null,stamp=pos.timestamp||Date.now();if(mps===null&&lastSpeedFix){const secs=(stamp-lastSpeedFix.time)/1000;if(secs>.2&&secs<5)mps=map.distance([c.latitude,c.longitude],lastSpeedFix.point)/secs}lastSpeedFix={point:[c.latitude,c.longitude],time:stamp};if(mps===null)return smoothedSpeedMph;const rawMph=Math.max(0,mps*2.236936);smoothedSpeedMph=smoothedSpeedMph===0?rawMph:smoothedSpeedMph*.65+rawMph*.35;$('#speedValue').textContent=String(Math.round(smoothedSpeedMph));return rawMph}
  function renderSettings(root){root.innerHTML=`<h2 class="form-title">Ride settings</h2><div class="settings-group"><h3>Automatic start</h3><p>Choose what starts the timer after you arm it.</p><select id="startMode"><option value="marker" ${settings.startMode==='marker'?'selected':''}>Start at the trail marker</option><option value="launch" ${settings.startMode==='launch'?'selected':''}>Start when I accelerate past 5 mph</option></select></div><div class="settings-group"><h3>Automatic finish</h3><p>Choose how an automatic run ends.</p><select id="finishMode"><option value="marker" ${settings.finishMode==='marker'?'selected':''}>Pass the finish marker</option><option value="slow" ${settings.finishMode==='slow'?'selected':''}>Near the finish and slow below 3 mph</option></select></div><div class="settings-group"><label class="setting-check"><input type="checkbox" id="showSpeed" ${settings.showSpeed?'checked':''}> Show large live speed during a ride</label><p style="margin:8px 0 0">Speed uses GPS updates. It appears on the focused ride screen.</p></div><p class="inline-note">Settings are saved on this device. GPS speed and distance can vary with reception.</p>`;$('#startMode').onchange=e=>{settings.startMode=e.target.value;saveSettings();setRideLabel()};$('#finishMode').onchange=e=>{settings.finishMode=e.target.value;saveSettings()};$('#showSpeed').onchange=e=>{settings.showSpeed=e.target.checked;saveSettings()}}
  function dist(a,b){return map.distance(a,b)}
  function length(points){let m=0;for(let i=1;i<points.length;i++)m+=dist(points[i-1],points[i]);return m}
  function niceDist(m){return m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m'}
  function drawSaved(){savedLayers.forEach(l=>map.removeLayer(l));savedLayers=[];const colors=['#c8f169','#ff744d','#63c7e8','#c39bff','#ffd166','#68d391','#ff8fab'];trails.filter(t=>!focusMode||t.id===selectedId).forEach(t=>{if(!t.points?.length)return;const color=colors[trails.indexOf(t)%colors.length],line=L.polyline(t.points,{color,weight:t.id===selectedId?7:5,opacity:t.id===selectedId?1:.82}).addTo(map);line.on('click',()=>choose(t.id));savedLayers.push(line);if(t.points.length>1){savedLayers.push(L.circleMarker(t.points[0],{radius:7,color:'#172014',weight:3,fillColor:'#c8f169',fillOpacity:1}).addTo(map));savedLayers.push(L.circleMarker(t.points.at(-1),{radius:7,color:'#172014',weight:3,fillColor:'#ff744d',fillOpacity:1}).addTo(map))}})}

  function finishRide(){if(!rideStart)return;const ms=performance.now()-rideStart;rideStart=null;clearInterval(timerLoop);if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;if(rideLine)map.removeLayer(rideLine);rideLine=null;autoArmed=false;autoDeparted=false;autoLeftFinish=false;smoothedSpeedMph=0;$('#speedValue').textContent='0';$('#timer').textContent=fmtTime(ms);const t=selected(),id=crypto.randomUUID?.()||String(Date.now());rides.unshift({id,trailId:t?.id,trailName:t?.name||'Unselected route',ms,date:new Date().toISOString(),points:rideTrack});lastSavedRideId=id;rideJustFinished=true;persistRides();status(lastPos?'GPS captured':'Timer saved',!!lastPos);hint('Run saved. Start another, review Results, or delete this attempt.');render();setRideLabel()}
  map.on('click',e=>{if(!drawing)return;draft.push(e.latlng);updateDraft()});
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;if(activeTab!=='builder')drawing=false;if(activeTab!=='results'){activeRideId=null;clearRideResult()}render()}));
  $('#satelliteBtn').onclick=()=>{if(map.hasLayer(streets))map.removeLayer(streets);satellite.addTo(map);$('#satelliteBtn').classList.add('active');$('#streetBtn').classList.remove('active')};$('#streetBtn').onclick=()=>{if(map.hasLayer(satellite))map.removeLayer(satellite);streets.addTo(map);$('#streetBtn').classList.add('active');$('#satelliteBtn').classList.remove('active')};$('#locateTop').onclick=locate;$('#locateMap').onclick=locate;$('#startRide').onclick=()=>startRide(false);$('#armAuto').onclick=startAutomatic;$('#finishRide').onclick=finishRide;$('#exitFocus').onclick=exitFocus;$('#newRide').onclick=newRide;$('#viewResults').onclick=openResults;$('#deleteRide').onclick=deleteLastRide;
  $('.app').classList.toggle('speed-visible',!!settings.showSpeed);render();drawSaved();setRideLabel();
})();
