<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{color-scheme:dark;--bg:#111512;--panel:#1a201b;--panel2:#232a24;--line:#343d35;--muted:#a1aaa0;--text:#f4f4ec;--lime:#c8f169;--orange:#ff744d;--radius:16px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.app{height:100dvh;min-height:600px;display:grid;grid-template-rows:64px 1fr;overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#151a16;z-index:500}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.06em}.logo{width:32px;height:32px;display:grid;place-items:center;background:var(--lime);color:#172014;border-radius:10px;font-size:18px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.14em;margin-top:1px}.top-right{display:flex;gap:10px;align-items:center}.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#727c72}.dot.on{background:var(--lime);box-shadow:0 0 10px #c8f16988}.topbtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:12px;font-weight:650}.layout{display:grid;grid-template-columns:350px 1fr;min-height:0}.sidebar{background:#151a16;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:400}.sidebar-head{padding:23px 21px 12px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--lime);font-weight:800}.sidebar h1{font-size:25px;line-height:1.1;margin:8px 0 7px;letter-spacing:-.04em}.sub{font-size:12px;color:var(--muted);line-height:1.5;margin:0}.tabs{display:flex;gap:4px;padding:0 20px 14px;border-bottom:1px solid var(--line)}.tab{flex:1;padding:10px 4px;background:transparent;color:var(--muted);border-radius:9px;font-size:12px;font-weight:700}.tab.active{background:var(--panel2);color:var(--text)}.content{padding:17px 20px;overflow:auto;flex:1}.section-label{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px;letter-spacing:.13em;font-weight:800;margin:2px 0 12px}.trail-list{display:flex;flex-direction:column;gap:9px}.trail-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;cursor:pointer;transition:.15s}.trail-card:hover,.trail-card.selected{border-color:#849954;background:#20281d}.trail-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.trail-name{font-size:14px;font-weight:750}.trail-meta{font-size:11px;color:var(--muted);margin-top:5px}.trail-best{font-size:11px;color:var(--lime);margin-top:10px}.tag{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--lime);background:#344128;padding:5px 7px;border-radius:999px;font-weight:800}.empty{padding:22px 16px;border:1px dashed #424b43;color:var(--muted);font-size:12px;line-height:1.5;text-align:center;border-radius:13px}.map-area{position:relative;min-width:0;background:#212821}#map{position:absolute;inset:0;background:#202922}.map-toolbar{position:absolute;top:16px;left:16px;z-index:500;display:flex;gap:8px}.map-chip{background:#171d19ed;color:var(--text);border:1px solid #505a50;border-radius:10px;padding:9px 12px;font-size:11px;font-weight:700;box-shadow:0 3px 14px #0004}.map-chip.active{border-color:var(--lime);color:var(--lime)}.map-actions{position:absolute;top:16px;right:16px;z-index:500;display:flex;gap:8px}.locate{width:38px;height:38px;display:grid;place-items:center;font-size:18px}.map-bottom{position:absolute;z-index:500;left:16px;right:16px;bottom:16px;display:flex;justify-content:space-between;align-items:end;gap:12px;pointer-events:none}.map-bottom>*{pointer-events:auto}.toast{background:#171d19ed;border:1px solid #505a50;border-radius:10px;padding:10px 12px;color:var(--muted);font-size:11px;max-width:min(420px,60vw)}.ride-panel{background:#171d19ed;border:1px solid #505a50;border-radius:14px;padding:12px 14px;min-width:215px;box-shadow:0 4px 20px #0005}.ride-trail{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.clock{font-size:27px;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:.03em;margin:4px 0 10px}.ride-buttons{display:flex;gap:7px}.primary{background:var(--lime);color:#182014;font-weight:850}.secondary{background:var(--panel2);border:1px solid var(--line)}.danger{background:#562b24;color:#ffd2c4}.action{padding:10px 13px;border-radius:10px;font-weight:750;font-size:12px}.action:disabled{opacity:.42;cursor:not-allowed}.form-title{font-size:16px;font-weight:750;margin:0 0 14px}.field{display:block;margin:0 0 12px}.field span{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#111612;color:var(--text)}.inline-note{font-size:11px;color:var(--muted);line-height:1.5;margin:12px 0}.form-actions{display:flex;gap:8px}.form-actions button{flex:1}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.stat{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat strong{display:block;font-size:19px}.stat span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.ride-item{display:flex;justify-content:space-between;gap:8px;background:var(--panel);padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}.ride-item strong{font-size:13px}.ride-item small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.ride-time{font-weight:800;font-variant-numeric:tabular-nums}.leaflet-control-attribution{font-size:9px!important;background:#101510dd!important;color:#d5ddd3!important}.leaflet-control-attribution a{color:#c8f169!important}.leaflet-control-zoom a{background:#171d19!important;color:white!important;border-color:#505a50!important}.leaflet-container{font:inherit}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#1a201b;color:#f4f4ec}.trail-marker{background:var(--lime);width:11px;height:11px;border:2px solid #172014;border-radius:50%;box-shadow:0 0 0 4px #c8f16955}.footer-mobile{display:none}
    @media(max-width:760px){.app{grid-template-rows:54px minmax(0,1fr);min-height:0;height:100dvh}.topbar{height:54px;padding:0 14px}.brand{font-size:13px;gap:9px}.logo{width:29px;height:29px}.status{font-size:11px}.topbtn{padding:8px 10px;font-size:11px}.layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(205px,30dvh)}.map-area{grid-row:1;min-height:260px}.sidebar{grid-row:2;border-right:0;border-top:1px solid var(--line);height:auto;min-height:0}.sidebar-head{display:none}.tabs{padding:8px 12px;border-bottom:1px solid var(--line);gap:8px}.tab{padding:10px 6px;font-size:12px}.content{padding:12px 14px}.section-label{margin-bottom:10px}.trail-list{gap:8px}.trail-card{padding:12px}.trail-best{margin-top:8px}.map-toolbar{top:10px;left:10px;right:58px;overflow-x:auto;scrollbar-width:none;gap:6px}.map-toolbar::-webkit-scrollbar{display:none}.map-actions{top:10px;right:10px}.map-chip{white-space:nowrap;padding:10px;font-size:11px}.map-bottom{left:10px;right:10px;bottom:10px;padding-bottom:env(safe-area-inset-bottom);display:flex;flex-direction:column-reverse;align-items:stretch;gap:6px}.toast{display:block;max-width:100%;font-size:11px;padding:8px 10px}.ride-panel{width:100%;min-width:0;padding:10px 12px;display:grid;grid-template-columns:1fr;gap:7px}.ride-trail{font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.clock{font-size:24px;margin:0}.ride-buttons{grid-column:1;grid-row:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{min-height:42px;padding:9px 10px;font-size:12px;white-space:nowrap}.leaflet-control-zoom{display:none}}
    @media(min-width:761px){.sidebar-head{padding:26px 24px 18px}.tabs{padding:0 22px 15px;gap:8px}.tab{padding:11px 8px}.content{padding:20px 22px}.trail-list{gap:10px}.trail-card{padding:15px}.map-toolbar{gap:9px}.map-chip{padding:10px 13px}.ride-panel{padding:14px 16px}.ride-buttons{gap:8px}}
    .trail-card{position:relative}.trail-card-main{cursor:pointer;min-width:0;flex:1}.trail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.trail-delete{flex:none;background:#30211e;border:1px solid #644036;color:#ffd2c4;border-radius:8px;padding:7px 9px;font-size:11px;font-weight:750}.trail-delete:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="brand"><div class="logo">↗</div><div>TRAILFORGE<small>RIDE YOUR GROUND</small></div></div><div class="top-right"><div class="status"><span id="gpsDot" class="dot"></span><span id="gpsStatus">Location off</span></div><button class="topbtn" id="locateTop">◎ <span class="wide">Find me</span></button></div></header>
  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-head"><div class="eyebrow">YOUR PRIVATE TRACKBOOK</div><h1>Make your ground<br>your raceway.</h1><p class="sub">Map a line. Ride it. Chase your best.</p></div>
      <nav class="tabs"><button class="tab active" data-tab="trails">Trails</button><button class="tab" data-tab="builder">Build</button><button class="tab" data-tab="results">Results</button></nav>
      <section class="content" id="content"></section>
    </aside>
    <section class="map-area"><div id="map"></div>
      <div class="map-toolbar"><button class="map-chip active" id="satelliteBtn">Satellite</button><button class="map-chip" id="streetBtn">Street</button><button class="map-chip" id="recordBtn">＋ Record trail</button></div>
      <div class="map-actions"><button class="map-chip locate" id="locateMap" aria-label="Find my location">◎</button></div>
      <div class="map-bottom"><div class="toast" id="mapHint">Find your property, then choose <b>Build</b> to draw a route.</div><div class="ride-panel"><div class="ride-trail" id="rideLabel">SELECT A TRAIL</div><div class="clock" id="timer">00:00.00</div><div class="ride-buttons"><button class="action primary" id="armAuto" disabled>Auto time</button><button class="action secondary" id="startRide" disabled>Manual start</button><button class="action danger" id="finishRide" hidden>Finish</button></div></div></div>
    </section>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const key='trailforge-v1';
  let trails=[]; try{trails=JSON.parse(localStorage.getItem(key)||'[]')}catch{}
  let rides=[]; try{rides=JSON.parse(localStorage.getItem(key+'-rides')||'[]')}catch{}
  let selectedId=null, activeTab='trails', drawing=false, draft=[], draftLine=null, savedLayers=[], gpsMarker=null, accuracyCircle=null, watchId=null, rideStart=null, timerLoop=null, rideTrack=[], rideLine=null, lastPos=null, recordingTrail=false, recordWatch=null, recordedPoints=[], recordLine=null, autoArmed=false, autoDeparted=false, autoLeftFinish=false, autoWatch=null, autoPrevDist=null, autoFirstFix=true, autoWasAtStart=false;
  const map=L.map('map',{zoomControl:false}).setView([39.5,-98.35],4);
  L.control.zoom({position:'bottomright'}).addTo(map);
  const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'});
  const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
  satellite.addTo(map);
  const fmtTime=ms=>{let cs=Math.floor(ms/10)%100,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`};
  const persist=()=>localStorage.setItem(key,JSON.stringify(trails));
  const persistRides=()=>localStorage.setItem(key+'-rides',JSON.stringify(rides));
  const selected=()=>trails.find(t=>t.id===selectedId);
  function status(text,on=false){$('#gpsStatus').textContent=text;$('#gpsDot').classList.toggle('on',on)}
  function dist(a,b){return map.distance(a,b)}
  function length(points){let m=0;for(let i=1;i<points.length;i++)m+=dist(points[i-1],points[i]);return m}
  function niceDist(m){return m>=1000?(m/1000).toFixed(2)+' km':Math.round(m)+' m'}
  function drawSaved(){savedLayers.forEach(l=>map.removeLayer(l));savedLayers=[];trails.forEach(t=>{if(!t.points?.length)return;const line=L.polyline(t.points,{color:t.id===selectedId?'#c8f169':'#ff744d',weight:t.id===selectedId?6:4,opacity:.94}).addTo(map);line.on('click',()=>choose(t.id));savedLayers.push(line);if(t.points.length>1){savedLayers.push(L.circleMarker(t.points[0],{radius:5,color:'#172014',weight:2,fillColor:'#c8f169',fillOpacity:1}).addTo(map));savedLayers.push(L.circleMarker(t.points.at(-1),{radius:5,color:'#172014',weight:2,fillColor:'#ff744d',fillOpacity:1}).addTo(map))}})}
  function bestFor(id){const times=rides.filter(r=>r.trailId===id).map(r=>r.ms);return times.length?Math.min(...times):null}
  function render(){const root=$('#content');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));
    if(activeTab==='trails'){root.innerHTML=`<div class="section-label"><span>SAVED TRAILS</span><span>${trails.length} ${trails.length===1?'ROUTE':'ROUTES'}</span></div>${trails.length?`<div class="trail-list">${trails.map(t=>{const best=bestFor(t.id);return `<article class="trail-card ${selectedId===t.id?'selected':''}" data-id="${t.id}"><div class="trail-row"><div class="trail-card-main" role="button" tabindex="0" aria-label="Select ${escapeHtml(t.name)}"><div class="trail-head"><div><div class="trail-name">${escapeHtml(t.name)}</div><div class="trail-meta">${niceDist(length(t.points||[]))} · ${(t.points||[]).length} points</div></div><span class="tag">${t.source==='gps'?'GPS':'Mapped'}</span></div><div class="trail-best">${best==null?'No timed rides yet':'Best · '+fmtTime(best)}</div></div><button class="trail-delete" data-delete="${t.id}" aria-label="Delete ${escapeHtml(t.name)}">Delete</button></div></article>`}).join('')}</div>`:`<div class="empty">No trails yet. Find your property, then draw a route or record one while you ride.</div>`}<p class="inline-note">Your routes and results are saved on this device.</p>`;
      root.querySelectorAll('.trail-card-main').forEach(c=>{c.onclick=()=>choose(c.closest('.trail-card').dataset.id);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(c.closest('.trail-card').dataset.id)}}});root.querySelectorAll('.trail-delete').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteTrail(b.dataset.delete)});
    } else if(activeTab==='builder'){root.innerHTML=`<h2 class="form-title">Draw a trail</h2><label class="field"><span>Trail name</span><input id="trailName" maxlength="40" placeholder="e.g. Creekside Loop"></label><div class="stats-grid"><div class="stat"><strong id="pointCount">${draft.length}</strong><span>Map points</span></div><div class="stat"><strong id="draftDist">${niceDist(length(draft))}</strong><span>Approx distance</span></div></div><div class="form-actions"><button class="action primary" id="drawToggle">${drawing?'Finish drawing':'Start drawing'}</button><button class="action secondary" id="undoPoint" ${draft.length?'':'disabled'}>Undo point</button></div><p class="inline-note">Zoom in close, start drawing, then tap the map to add points along your property. Save when the line is ready.</p><div class="form-actions"><button class="action secondary" id="saveTrail" ${draft.length<2?'disabled':''}>Save trail</button><button class="action secondary" id="clearDraft" ${draft.length?'':'disabled'}>Clear</button></div>`;
      $('#drawToggle').onclick=()=>{drawing=!drawing;$('#recordBtn').classList.toggle('active',drawing);hint(drawing?'Tap the map to add route points. Tap Finish drawing when done.':'Drawing paused. Save your trail or continue adding points.');render()};$('#undoPoint').onclick=()=>{draft.pop();updateDraft();render()};$('#clearDraft').onclick=()=>{draft=[];updateDraft();render()};$('#saveTrail').onclick=saveDraft;
    } else {const total=rides.length,best=rides.length?Math.min(...rides.map(r=>r.ms)):null;root.innerHTML=`<div class="section-label"><span>YOUR RIDE STATS</span></div><div class="stats-grid"><div class="stat"><strong>${total}</strong><span>Timed rides</span></div><div class="stat"><strong>${best==null?'—':fmtTime(best)}</strong><span>Fastest ride</span></div></div><div class="section-label"><span>RECENT RIDES</span><span>${Math.min(20,rides.length)} SHOWN</span></div>${rides.length?rides.slice(0,20).map(r=>`<div class="ride-item"><div><strong>${escapeHtml(r.trailName)}</strong><small>${new Date(r.date).toLocaleDateString()} · ${r.points?.length||0} GPS points</small></div><div class="ride-time">${fmtTime(r.ms)}</div></div>`).join(''):`<div class="empty">Your ride times will show up here after your first run.</div>`}<p class="inline-note">Use Auto time to start and finish at the trail markers, or use the manual controls. GPS can drift under tree cover.</p>`}
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function hint(s){$('#mapHint').textContent=s}
  function updateDraft(){if(draftLine)map.removeLayer(draftLine);draftLine=draft.length?L.polyline(draft,{color:'#c8f169',weight:5,dashArray:'10 8'}).addTo(map):null;if($('#pointCount'))$('#pointCount').textContent=draft.length;if($('#draftDist'))$('#draftDist').textContent=niceDist(length(draft));if($('#saveTrail'))$('#saveTrail').disabled=draft.length<2;if($('#undoPoint'))$('#undoPoint').disabled=!draft.length;if($('#clearDraft'))$('#clearDraft').disabled=!draft.length}
  function saveDraft(){if(draft.length<2)return;const name=$('#trailName').value.trim()||`Trail ${trails.length+1}`;const t={id:crypto.randomUUID?.()||String(Date.now()),name,points:draft.map(p=>[p.lat,p.lng]),source:'mapped',createdAt:Date.now()};trails.unshift(t);persist();draft=[];drawing=false;selectedId=t.id;activeTab='trails';drawSaved();render();setRideLabel();hint('Trail saved. Select it and start a timed ride whenever you’re ready.')}
  function saveRecorded(points){if(points.length<2){hint('Not enough GPS points yet. Keep the app open while you ride, then try again.');return}draft=points.map(p=>L.latLng(p[0],p[1]));activeTab='builder';render();$('#trailName').value=`Recorded ${new Date().toLocaleDateString()}`;hint('GPS route captured. Name it and save your new trail.')}
  function toggleRecord(){if(!recordingTrail){if(!navigator.geolocation){hint('Location is not available in this browser.');return}recordedPoints=[];if(recordLine)map.removeLayer(recordLine);recordLine=L.polyline([],{color:'#c8f169',weight:5,dashArray:'8 6'}).addTo(map);recordingTrail=true;$('#recordBtn').textContent='■ Stop recording';$('#recordBtn').classList.add('active');hint('Recording your GPS route. Keep this screen open as you ride; tap Stop recording when done.');status('Recording GPS…');recordWatch=navigator.geolocation.watchPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude];recordedPoints.push(p);recordLine.addLatLng(p);lastPos=p;if(gpsMarker)gpsMarker.setLatLng(p);else gpsMarker=L.circleMarker(p,{radius:7,color:'#111512',weight:3,fillColor:'#c8f169',fillOpacity:1}).addTo(map);status(`Recording · ±${Math.round(pos.coords.accuracy)} m`,true) },()=>{hint('GPS signal is weak. Keep recording while the phone finds a better fix.')},{enableHighAccuracy:true,maximumAge:1000,timeout:12000});return}recordingTrail=false;if(recordWatch!==null)navigator.geolocation.clearWatch(recordWatch);recordWatch=null;$('#recordBtn').textContent='＋ Record trail';$('#recordBtn').classList.remove('active');saveRecorded(recordedPoints);recordedPoints=[]}
  function choose(id){selectedId=id;drawSaved();render();setRideLabel();const t=selected();if(t?.points?.length){map.fitBounds(t.points,{padding:[55,55],maxZoom:17});hint(`${t.name} selected · ${niceDist(length(t.points))}. Choose Auto time or Manual start.`)}}
  function deleteTrail(id){const t=trails.find(x=>x.id===id);if(!t||!window.confirm(`Delete “${t.name}”? Its saved route will be removed. Ride results will stay in Results.`))return;trails=trails.filter(x=>x.id!==id);if(selectedId===id)selectedId=null;persist();drawSaved();render();setRideLabel();hint(`${t.name} deleted. Ride results are still saved.`)}
  function setRideLabel(){const t=selected();$('#rideLabel').textContent=t?t.name.toUpperCase():'SELECT A TRAIL';$('#startRide').disabled=!t||!!rideStart||autoArmed;$('#armAuto').disabled=!t||!!rideStart;$('#armAuto').textContent=autoArmed?'Cancel auto':'Auto time'}
  function autoRadius(accuracy=8){return Math.max(18,Math.min(80,accuracy*1.5))}
  function toggleAuto(){const t=selected();if(autoArmed){if(autoWatch!==null)navigator.geolocation.clearWatch(autoWatch);autoWatch=null;autoArmed=false;autoDeparted=false;autoPrevDist=null;setRideLabel();hint('Automatic timing cancelled.');status('GPS ready');return}if(!t||t.points.length<2)return;if(!navigator.geolocation||!window.isSecureContext){hint('Automatic timing needs GPS. Open this page on your phone over HTTPS and allow location access.');return}autoArmed=true;autoDeparted=false;autoLeftFinish=false;autoPrevDist=null;autoFirstFix=true;autoWasAtStart=false;setRideLabel();hint('Auto timing armed. If you are at the start, ride away to begin. Otherwise, cross the start marker. Keep this page open.');status('Waiting for GPS…');const start=t.points[0];autoWatch=navigator.geolocation.watchPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude],dStart=map.distance(p,start),radius=autoRadius(pos.coords.accuracy);lastPos=p;if(gpsMarker)gpsMarker.setLatLng(p);else gpsMarker=L.circleMarker(p,{radius:7,color:'#111512',weight:3,fillColor:'#c8f169',fillOpacity:1}).addTo(map);status(`GPS ±${Math.round(pos.coords.accuracy)} m`,true);if(autoFirstFix){autoFirstFix=false;autoWasAtStart=dStart<=radius;autoPrevDist=dStart;if(autoWasAtStart)hint('At the start. Ride away from the marker to begin timing.');return}const crossedFromOutside=autoPrevDist!==null&&autoPrevDist>radius&&dStart<=radius;if(autoWasAtStart&&dStart>radius+8){autoDeparted=true;autoWasAtStart=false;autoWatch!==null&&navigator.geolocation.clearWatch(autoWatch);autoWatch=null;autoArmed=false;startRide(true);return}if(!autoWasAtStart&&crossedFromOutside){autoDeparted=true;autoWatch!==null&&navigator.geolocation.clearWatch(autoWatch);autoWatch=null;autoArmed=false;startRide(true);return}autoPrevDist=dStart},err=>{status(err.code===1?'Location blocked':'GPS signal weak');if(err.code===1){autoArmed=false;autoWatch=null;setRideLabel();hint('Allow location access for this website in Safari settings, then tap Auto time again.')}else hint('Waiting for GPS accuracy to improve. Keep this page open with location enabled.')},{enableHighAccuracy:true,maximumAge:0,timeout:20000})}
  function locate(){if(!navigator.geolocation){status('Location unavailable');hint('This browser does not support location.');return}if(!window.isSecureContext){status('Secure page needed');hint('Find Me needs a secure page. This prototype is open as a local file; run it at localhost or on an HTTPS website to enable phone location.');return}status('Finding location…');navigator.geolocation.getCurrentPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude];lastPos=p;map.setView(p,17);if(gpsMarker)map.removeLayer(gpsMarker);gpsMarker=L.circleMarker(p,{radius:7,color:'#111512',weight:3,fillColor:'#c8f169',fillOpacity:1}).addTo(map).bindPopup('You are here');if(accuracyCircle)map.removeLayer(accuracyCircle);accuracyCircle=L.circle(p,{radius:pos.coords.accuracy,color:'#c8f169',weight:1,opacity:.45,fillOpacity:.07}).addTo(map);status(`GPS ±${Math.round(pos.coords.accuracy)} m`,true);hint('Location found. Satellite imagery can help you trace a route around your property.')},err=>{status('Location blocked');hint(err.code===1?'Location permission was denied. Allow it for this page in your browser settings, then try again.':err.code===2?'The device could not determine your location. Check Location Services and move somewhere with a clearer sky.':'Location timed out. Check Location Services and try again.')},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
  function startRide(automatic=false){const t=selected();if(!t||rideStart)return;autoDeparted=automatic;autoLeftFinish=false;autoPrevDist=null;rideStart=performance.now();rideTrack=[];rideLine=L.polyline([],{color:'#ff744d',weight:4}).addTo(map);$('#startRide').hidden=true;$('#armAuto').hidden=true;$('#finishRide').hidden=false;$('#finishRide').textContent='Finish';$('#rideLabel').textContent='RACING · '+t.name.toUpperCase();hint(automatic?'Timer started at the start point. It will stop when you cross the finish point.':'Ride in progress. Keep this screen open so GPS can record your route.');timerLoop=setInterval(()=>$('#timer').textContent=fmtTime(performance.now()-rideStart),33);if(navigator.geolocation){watchId=navigator.geolocation.watchPosition(pos=>{const p=[pos.coords.latitude,pos.coords.longitude],radius=autoRadius(pos.coords.accuracy);lastPos=p;rideTrack.push(p);rideLine.addLatLng(p);if(gpsMarker)gpsMarker.setLatLng(p);else gpsMarker=L.circleMarker(p,{radius:7,color:'#111512',weight:3,fillColor:'#c8f169',fillOpacity:1}).addTo(map);status(`Riding · GPS ±${Math.round(pos.coords.accuracy)} m`,true);if(automatic){const trail=selected(),start=trail.points[0],end=trail.points.at(-1),loop=map.distance(start,end)<30,dStart=map.distance(p,start),dEnd=map.distance(p,end),prev=autoPrevDist;if(loop){if(dStart>radius+8)autoLeftFinish=true;if(autoLeftFinish&&dStart<=radius&&prev!==null&&prev>radius)finishRide()}else{if(dEnd>radius+8)autoLeftFinish=true;if(autoLeftFinish&&dEnd<=radius&&prev!==null&&prev>radius)finishRide()}autoPrevDist=loop?dStart:dEnd}},()=>status('Ride on · GPS signal weak',false),{enableHighAccuracy:true,maximumAge:500,timeout:15000})}else{hint('Location is unavailable, but the timer will still run.');status('Timer only') }}
  function finishRide(){if(!rideStart)return;const ms=performance.now()-rideStart;rideStart=null;clearInterval(timerLoop);if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;autoArmed=false;autoDeparted=false;autoLeftFinish=false;$('#startRide').hidden=false;$('#armAuto').hidden=false;$('#finishRide').hidden=true;$('#timer').textContent=fmtTime(ms);const t=selected();rides.unshift({id:String(Date.now()),trailId:t?.id,trailName:t?.name||'Unselected route',ms,date:new Date().toISOString(),points:rideTrack});persistRides();status(lastPos?'GPS captured':'Timer saved',!!lastPos);hint('Ride saved. Open Results to review your time.');render();setRideLabel()}
  map.on('click',e=>{if(!drawing)return;draft.push(e.latlng);updateDraft()});
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{activeTab=b.dataset.tab;if(activeTab!=='builder')drawing=false;render()}));
  $('#satelliteBtn').onclick=()=>{if(map.hasLayer(streets))map.removeLayer(streets);satellite.addTo(map);$('#satelliteBtn').classList.add('active');$('#streetBtn').classList.remove('active')};$('#streetBtn').onclick=()=>{if(map.hasLayer(satellite))map.removeLayer(satellite);streets.addTo(map);$('#streetBtn').classList.add('active');$('#satelliteBtn').classList.remove('active')};$('#locateTop').onclick=locate;$('#locateMap').onclick=locate;$('#recordBtn').onclick=toggleRecord;$('#startRide').onclick=()=>startRide(false);$('#armAuto').onclick=toggleAuto;$('#finishRide').onclick=finishRide;
  render();drawSaved();setRideLabel();
